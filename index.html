<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>씨드팝 (SeedPop) — 영단어 놀이터</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- App Version (Single Source of Truth: YYYY.MM.DD.Seq) -->
  <script>
    window.APP_VERSION = "2026.09.28.1";
  </script>

  <!-- CSS Stylesheet -->
  <script>
    document.write('<link rel="stylesheet" href="index.css?v=' + window.APP_VERSION + '">');
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="brand">
        <div class="brand-logo">
          <i data-lucide="sparkles"></i>
        </div>
        <div class="brand-info">
          <h1>씨드팝!</h1>
          <span>April Seed 1</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn active" data-target="dashboard-tab">
          <i data-lucide="layout-dashboard"></i>
          <span>대시보드</span>
        </button>
        <button class="nav-btn" data-target="study-tab" id="nav-study-btn">
          <i data-lucide="book-open"></i>
          <span>플래시카드 학습</span>
          <span class="badge" id="sidebar-due-badge" style="display: none;">0</span>
        </button>
        <button class="nav-btn" data-target="quiz-tab">
          <i data-lucide="award"></i>
          <span>단어 퀴즈</span>
        </button>

        <button class="nav-btn" data-target="manage-tab">
          <i data-lucide="folder-edit"></i>
          <span>단어장 관리</span>
        </button>
      </nav>

      <div class="sidebar-footer" style="text-align: center; margin-top: auto; padding-top: 16px;">
        <p style="font-size: 12px; color: var(--text-muted); font-weight: 600;">
          &copy; 2026 SeedPop <span id="app-version-badge"><script>document.write('v' + window.APP_VERSION);</script></span>
        </p>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Top Header -->
      <header class="app-header">
        <div class="header-welcome">
          <h2>안녕, 반가워! 👋</h2>
          <p>오늘도 신나게 단어를 마스터해보자!</p>
        </div>
        <div class="streak-badge" id="header-streak-badge">
          🔥 0일 연속 학습 중!
        </div>
      </header>

      <!-- TAB 1: Dashboard -->
      <section id="dashboard-tab" class="tab-content active"></section>

      <!-- TAB 2: Flashcard Study -->
      <section id="study-tab" class="tab-content"></section>

      <!-- TAB 3: Word Quiz -->
      <section id="quiz-tab" class="tab-content"></section>



      <!-- TAB 6: Word Management -->
      <section id="manage-tab" class="tab-content"></section>
    </main>
  </div>

  <!-- JavaScript Modules (Loaded with APP_VERSION cache-busting) -->
  <script>
    [
      "default-words.js",
      "js/voice-engine.js",
      "js/core-state.js",
      "js/tab-dashboard.js",
      "js/tab-study.js",
      "js/tab-quiz.js",
      "js/tab-manage.js"
    ].forEach(function(src) {
      document.write('<script src="' + src + '?v=' + window.APP_VERSION + '"><\/script>');
    });
  </script>

  <!-- Router & Tab Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // Initialize streak in header
      const streakBadge = document.getElementById('header-streak-badge');
      if (streakBadge) {
        streakBadge.innerText = `🔥 ${window.seedState.streak}일 연속 학습 중!`;
      }

      // Initialize tabs
      window.tabDashboard.init();
      window.tabStudy.init();
      window.tabQuiz.init();
      window.tabManage.init();

      // Navigation handler
      const navBtns = document.querySelectorAll('.nav-btn');
      const tabs = document.querySelectorAll('.tab-content');

      navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-target');

          navBtns.forEach(b => b.classList.remove('active'));
          tabs.forEach(t => t.classList.remove('active'));

          btn.classList.add('active');
          const targetTab = document.getElementById(target);
          if (targetTab) {
            targetTab.classList.add('active');
          }

          // Trigger tab re-initialization on active
          if (target === 'dashboard-tab') window.tabDashboard.init();
          if (target === 'study-tab') window.tabStudy.init();
          if (target === 'quiz-tab') window.tabQuiz.init();
          if (target === 'manage-tab') window.tabManage.init();
        });
      });
    });
  </script>
</body>

</html>
